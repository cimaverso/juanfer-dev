server {
    listen 80;
    server_name _;

    # El backend monta sus rutas bajo /api/v1 (ver app/main.py); sin este
    # límite, un archivo subido más grande que 1MB (default de nginx)
    # falla con 413 antes de llegar al backend (DT-004). 20M por margen,
    # sin límite real conocido todavía en el código.
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache para assets estáticos con hash (Vite los genera con hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy al backend FastAPI. Sin "/" al final de la URL del upstream:
    # así nginx reenvía la URI completa (/api/v1/...) tal cual, que es lo
    # que el backend espera (monta sus rutas bajo ese mismo prefijo). Con
    # "/" al final, nginx recortaba el "/api/" y el backend recibía
    # "/v1/..." -> 404 en todo (DT-010).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Todo lo demás va al frontend (SPA)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}